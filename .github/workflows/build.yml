name: Build Faper Trainer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame

      - name: Build app
        run: |
          pyinstaller --onedir --windowed gui.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: faper-trainer-${{ matrix.os }}
          path: dist/
